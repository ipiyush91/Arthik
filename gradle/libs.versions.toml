[versions]
agp = "8.13.0"
kotlin = "2.2.20"
ksp = "2.2.20-2.0.3"
coreKtx = "1.17.0"
activityCompose = "1.11.0"
composeBom = "2025.09.00"
lifecycle = "2.9.4"
navigation = "2.9.4"
room = "2.8.0"
paging = "3.3.6"
work = "2.10.4"

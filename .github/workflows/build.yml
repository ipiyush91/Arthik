name: Build Arthik

on:
  push:
    branches: [ arthik-v1, main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  core-tests:
    name: Core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Run core tests
        run: ./gradlew :core:test --console=plain -q

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/

  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Write local.properties
        run: echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

      - name: Show Android SDK contents
        run: ls /usr/local/lib/android/sdk/ 2>/dev/null || echo "SDK not found at expected path"

      - name: Build debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          ./gradlew :app:assembleDebug --console=plain --stacktrace 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      - name: Find APK
        if: always()
        run: find app/build/outputs -name "*.apk" 2>/dev/null || echo "No APK found"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: arthik-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

  build-release:
    name: Build release APK
    runs-on: ubuntu-latest
    needs: core-tests
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Decode keystore
        if: env.KEYSTORE_PASSWORD != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/arthik.jks
          cat > keystore.properties <<EOF
          storeFile=arthik.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Write local.properties
        run: echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

      - name: Build release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./gradlew :app:assembleRelease --console=plain -q

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: arthik-release
          path: app/build/outputs/apk/release/app-release*.apk
          retention-days: 30
